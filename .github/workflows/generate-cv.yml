name: Generate CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'build_cv_site_final.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install fonts
        run: sudo apt-get install -y fonts-liberation

      - name: Install Python dependencies
        run: pip install reportlab pypdf

      - name: Generate CVs
        run: python build_cv_site_final.py
        env:
          CV_OUTPUT_DIR: .

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CV_Ana_Noronha_2026_PT_FINAL.pdf CV_Ana_Noronha_2026_EN_FINAL.pdf
          git diff --cached --quiet || git commit -m "chore: regenerate CV PDFs"
          git push
